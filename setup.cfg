[metadata]
name = jetio
version = 1.2.1
author = Stephen Tete
author_email = cehstephen@gmail.com
description = A modern, high-performance Python web framework designed to transform your SQLAlchemy models directly into fully-featured, production-ready REST APIs with minimal code. Built with asyncio, SQLAlchemy, and Pydantic.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/cehstephen/jetio
project_urls =
    Bug Tracker = https://github.com/cehstephen/jetio/issues
license_file = LICENSE
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    sqlalchemy
    pydantic[email]
    pydantic-settings
    jinja2
    uvicorn[standard]
    starlette
    python-multipart
    passlib
    PyJWT    
    jetio-auth
    aiosqlite
    
[options.packages.find]
exclude =
    tests
    tests.*
    examples
    examples.*
    
[options.extras_require]
bcrypt = passlib[bcrypt]
test =
    pytest
    pytest-asyncio
    httpx
    
